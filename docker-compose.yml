version: '3.8'

services:
  # The FastAPI Firewall Service
  firewall-api:
    build: .
    container_name: prompt-firewall-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # The Streamlit Dashboard Service
  security-dashboard:
    build: .
    container_name: prompt-firewall-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: streamlit run dashboard/main.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - firewall-api